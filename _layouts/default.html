<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · kummai{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FNMXG8S19N"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FNMXG8S19N');
</script>
</head>
<body>

<div class="fog f1"></div>
<div class="fog f2"></div>
<div class="fog f3"></div>

<main>

  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="brand">kummai<span class="dot">.</span></a>
    <nav class="site-nav">
      <a href="{{ '/notes/' | relative_url }}">notes</a>

  <footer>

</html>
